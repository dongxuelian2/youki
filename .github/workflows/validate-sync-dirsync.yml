name: Validate sync and dirsync fix
on:
  push:
    branches: [codex/validate-sync-dirsync]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  focused:
    if: "!contains(github.event.head_commit.message, '[serial-only]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libsystemd-dev build-essential libelf-dev libseccomp-dev libclang-dev libssl-dev busybox-static
          mkdir -p results
          uname -a | tee results/kernel.txt
      - name: Expose the regression on upstream production code
        run: |
          python3 .validation/toggle_fix.py remove
          set +e
          CARGO_TERM_COLOR=never cargo +stable test -p libcontainer --lib --locked rootfs::mount::tests::test_mount_into_container_sync_flags -- --exact --test-threads=1 >results/before-unit.log 2>&1
          status=$?
          set -e
          cat results/before-unit.log
          test "$status" -ne 0
          grep -F 'test result: FAILED. 0 passed; 1 failed' results/before-unit.log
      - name: Issue reproduction before the fix
        run: |
          cargo +stable build -p youki --features v1,v2,systemd,seccomp --locked
          sudo unshare --mount --propagation private --fork python3 .validation/repro.py --runtime target/debug/youki --phase before | tee results/before-oci.log
      - name: Restore the fix
        if: always()
        run: python3 .validation/toggle_fix.py restore
      - name: Focused tests after the fix
        run: |
          cargo +stable test -p libcontainer --lib --locked -- rootfs:: syscall:: --test-threads=1 | tee results/after-unit.log
          cargo +stable test -p libcontainer --all-features --lib --locked rootfs:: -- --test-threads=1 | tee results/after-all-features.log
      - name: Real kernel mounts in a private namespace
        run: |
          sudo env PATH="$PATH" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" cargo +stable test -p libcontainer --lib --locked rootfs::mount::tests::test_mount_into_container_sync_flags_kernel -- --exact --ignored --test-threads=1 | tee results/kernel-mount.log
      - name: Issue reproduction after the fix
        run: |
          cargo +stable build -p youki --features v1,v2,systemd,seccomp --locked
          sudo unshare --mount --propagation private --fork python3 .validation/repro.py --runtime target/debug/youki --phase after | tee results/after-oci.log
          git diff --check
      - name: Stable clippy (record new-toolchain lint failures separately)
        if: always()
        run: cargo +stable clippy -p libcontainer --all-targets --all-features --locked -- -D warnings 2>&1 | tee results/focused-clippy.log
      - name: Clippy with the repository's pinned toolchain
        if: always()
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy
          cargo +1.96.0 clippy -p libcontainer --all-targets --all-features --locked -- -D warnings 2>&1 | tee results/pinned-clippy.log
      - name: Make disposable fixture evidence readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-evidence
          path: |
            results/*.log
            results/*.txt
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check
  workspace:
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[serial-only]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libsystemd-dev build-essential libelf-dev libseccomp-dev libclang-dev libssl-dev
          sudo useradd -m -d /tmp/testuser testuser
          echo "TEST_NON_ROOT_UID=$(id -u testuser)" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p results
      - name: Workspace tests
        run: |
          git restore --source=18c9fa1e7810bf25cc3864fbe45d1988b3676a28 --worktree -- crates/libcontainer/src/rootfs/mount.rs crates/libcontainer/src/rootfs/utils.rs
          set +e
          CARGO_TERM_COLOR=never cargo +stable test -p libcontainer --all-features --lib --locked tty::tests:: -- --test-threads=1 >results/baseline-tty.log 2>&1
          baseline_status=$?
          set -e
          cat results/baseline-tty.log
          test "$baseline_status" -ne 0
          grep -F 'ptmx handle is not on a real devpts mount' results/baseline-tty.log
          git restore --source=HEAD --worktree -- crates/libcontainer/src/rootfs/mount.rs crates/libcontainer/src/rootfs/utils.rs
          sudo env PATH="$PATH" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" HOME="$HOME" USER="$(id -un)" LOGNAME="$(id -un)" CARGO_PROFILE_DEV_DEBUG=0 CARGO_INCREMENTAL=0 TEST_NON_ROOT_UID="$TEST_NON_ROOT_UID" RUSTFLAGS="$RUSTFLAGS" unshare --mount --propagation private --fork bash -euo pipefail -c '
            mount --bind /dev/pts/ptmx /dev/ptmx
            stat -f -c "ptmx filesystem: %T (%t)" /dev/ptmx
            exec setpriv --reuid="$1" --regid="$2" --init-groups timeout 20m cargo +stable test --workspace --all-features --locked --no-fail-fast -- --test-threads=1
          ' _ "$(id -u)" "$(id -g)" 2>&1 | tee results/workspace-tests.log
      - name: Restore candidate after the baseline comparison
        if: always()
        run: git restore --source=HEAD --worktree -- crates/libcontainer/src/rootfs/mount.rs crates/libcontainer/src/rootfs/utils.rs
      - name: Workspace clippy
        if: "always() && !contains(github.event.head_commit.message, '[test-only]')"
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee results/workspace-clippy.log
      - name: Pinned workspace clippy
        if: "always() && !contains(github.event.head_commit.message, '[test-only]')"
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy
          cargo +1.96.0 clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee results/pinned-workspace-clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-evidence
          path: results
